[[stages]]
id = "reporting"
title = "Evidence synthesis and figures"
question = "How are frozen estimands converted into a report without rewriting diagnostic history?"
method = "Keep study records byte-preserved, organize the cross-study claim in the mainline workflow, and require source data plus panel provenance for promoted figures."
finding = "The repository exposes one current claim graph, a complete evidence ledger, historical snapshots, and paper-aligned behavioral figures."
boundary = "The current synthesis remains indexed rather than final; a later scientific curation pass may reorder the argument without changing frozen records."
depends_on = ["algorithm_and_transport"]
implementation = ["fsrl/infra/study_registry.py", "fsrl/workflows/schema.py", "fsrl/workflows/frozen_evidence.py", "fsrl/workflows/paper_figures.py"]
tests = ["tests/infra/test_study_registry.py", "tests/workflows/test_schema.py", "tests/workflows/test_frozen_evidence.py", "tests/workflows/test_paper_figures.py"]
studies = ["behavior_reproduction_map"]

[[stages.evidence]]
study = "behavior_reproduction_map"
record = "records/results/model_behavior_reproduction_map_v1.json"
json_pointer = "/summary/status_counts"
use = "constrains"
description = "Six phenomena reproduce and three remain quantitative mismatches; none is absent."

