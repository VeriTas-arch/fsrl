schema_version = 1
id = "resampled_cohort_diagnostic"
title = "Fixed Resampled learner across independent cohorts"
chapter = "minimal_models"
order = 50
status = "mixed"
review_state = "indexed"
question = "Does the failed Resampled pilot show sustained original Liu distance-slope mismatch across new simulated cohorts, and are the other behavioral rows stable?"
finding = "All 400 independent cohorts per frozen fit are complete and independently reconstructed. All three fits have sustained_above_reference distance slope; self-consistent incorrect proportions are also above reference and correct-ranker proportions below. Six other continuous endpoint means have intervals inside their references. All-nine qualitative cohort pass rates are 97.25%; joint quantitative/qualitative rates are 2.00%, 2.00% and 2.75%, reported descriptively without a new cutoff. No parent-outcome revision or main-model promotion."
boundary = "Not confirmation, human equivalence or main-model promotion. No training or calibration; original human intervals and failed parent outcomes remain unchanged."

