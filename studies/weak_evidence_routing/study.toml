schema_version = 1
id = "weak_evidence_routing"
title = "Weak evidence access to a jointly trained plastic RNN"
chapter = "algorithmic_compression"
order = 1020
status = "supporting"
review_state = "indexed"
question = "Does selectively withholding weak global evidence restore coherent individual variation while local evidence remains available?"
finding = "All three paired seeds support the registered routing effect and isolated core behavior; all isolated N=8 models pass nine qualitative rows. Triggered N=6/10 evaluation completed for every model, with all nine isolated size cells passing core checks. Accuracy decreases materially; shared also has core-qualified networks, so isolation is not established as necessary. Frozen development evidence, without main-model promotion."
boundary = "Three paired developmental seeds, fixed joint recipe and simulated cohorts; routing plus adaptation, without human confirmation, learned-gate claims or automatic promotion."

