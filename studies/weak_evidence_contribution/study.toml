schema_version = 1
id = "weak_evidence_contribution"
title = "Weak evidence contribution in frozen shared and cost RNNs"
chapter = "algorithmic_compression"
order = 1040
status = "supporting"
review_state = "indexed"
question = "Does the frozen cost-constrained RNN still use weakly admitted evidence for global inference, despite substantially lower connection modification?"
finding = "All three frozen Cost networks retain beneficial single and joint weak-evidence contributions, with smaller nonlearned CE effects than Shared. Joint global weak deletion reduces all-subject Cost order tau from 0.865-0.893 to 0.496-0.512 while preserving registered competence and coherence, at an accuracy cost. Acute routing evidence; no learned routing or main-model promotion."
boundary = "Functional causal contribution to terminal readout of frozen networks, on an already project-exposed synthetic Liu cohort. Not a measurement of stored bits, absence of coding, a human confirmation, physiological cost or main-model promotion. Acute joint deletion may be outside the trained distribution."

