schema_version = 1
id = "admission_hint_removal"
title = "Explicit admission-hint removal in a single-memory RNN"
chapter = "algorithmic_compression"
order = 1100
status = "mixed"
review_state = "indexed"
question = "Can the single-memory RNN dispense with the explicit admission hint zq while retaining exactly the same realized q, relational competence, organized individuality and observation-training compensation?"
finding = "No-hint single-memory RNNs retain competence/binding, Ae9/9 and Ce8/9 core and all three network-level compensation summaries. Two of three pairs pass Ce five-endpoint noninferiority;2531 has clear generic learned/nonlearned losses beyond2pp. Overall removal not supported; conditional compact export not triggered. No tuning or independent confirmation."
boundary = "Three matched A/C instances and exposed panels; zq hint removed with unchanged q and no local memory. No human confirmation or promotion."

