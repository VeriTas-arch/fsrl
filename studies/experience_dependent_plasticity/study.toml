schema_version = 1
id = "experience_dependent_plasticity"
title = "Experience-dependent score plasticity design"
chapter = "minimal_models"
order = 70
status = "frozen_contract"
review_state = "indexed"
question = "Can repeated-evidence plasticity stabilization improve complete internal order formation and ranking composition in the two-scalar Resampled score learner?"
finding = "The paired fixed-eta versus experience-dependent Resampled design completed all six mandatory fits and the repaired generic scheduler audit. Generic competence and late-sensitivity gates passed in every seed, but relation-specific loss superiority did not; the frozen rule therefore selects the simpler global blockwise diminishing-plasticity schedule before Liu input lock."
boundary = "Generic evidence supports declining within-episode plasticity and rejects a relation-familiarity interpretation within the tested scheduler family; it is not Liu behavioral support. All 400 Liu cohorts are now input-locked before model rollout, and the registered evaluation is authorized. Calibration, scientific candidate repair, fresh replication, circuit verification and main-model promotion remain closed."

