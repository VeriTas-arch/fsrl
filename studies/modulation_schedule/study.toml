schema_version = 1
id = "modulation_schedule"
title = "State dependence versus stage schedules in affine modulation"
chapter = "algorithmic_compression"
order = 1130
status = "mixed"
review_state = "indexed"
question = "Do frozen affine RNNs require within-stage modulation variation, or do fixed stage/global schedules preserve competence, individualized organization and A/C compensation? Independently locate the compact-export numerical mismatch."
finding = "Phase constants preserve competence, individualized organization and compensation in all three frozen pairs, but fail Ce probability noninferiority with reduced effective writes; primary CE compensation attenuation is not supported. Conditional constant evaluation/training did not trigger. Compact P_T mismatch localized without requalification."
boundary = "Frozen six affine models; exposed panels; phase and conditional constant interventions. No universal necessity, human confirmation or main-model promotion. Compact diagnosis is separate."

