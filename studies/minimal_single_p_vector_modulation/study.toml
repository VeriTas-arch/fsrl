schema_version = 1
id = "minimal_single_p_vector_modulation"
title = "Postsynaptic vector modulation in minimal single-P M2"
chapter = "algorithmic_compression"
order = 1320
status = "valid_negative"
review_state = "indexed"
question = "Holding M2 inputs, persistent state, readout, task streams, optimization, observation process, and evaluation arrays fixed, does replacing the shared scalar write modulator with a postsynaptic-neuron-specific instantaneous vector recover constrained Liu morphology without damaging competence?"
finding = "Frozen development result: all 3 networks were stable_constructive and used strongly non-scalar writes without competence damage, but 0/9 noisy units passed all nine rows or constrained morphology. Difficult-pair bimodality failed in 9/9 and stable within-subject errors failed in 6/9; outcome used_without_rescue."
boundary = "P remains the only episode-persistent plastic state. This exposed three-seed development study tests heterogeneous write allocation, not confirmation, biological implementation, or main-model promotion."

