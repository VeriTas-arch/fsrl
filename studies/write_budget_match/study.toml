schema_version = 1
id = "write_budget_match"
title = "Actual stage write budgets versus modulation organization"
chapter = "algorithmic_compression"
order = 1140
status = "mixed"
review_state = "indexed"
question = "After matching actual closed-loop L1 writes in each active phase, do stage constants recover the frozen affine RNN prediction loss?"
finding = "All six calibrations match; evaluation Ce generic phase budgets are equivalent in all three seeds, yet CE residuals stay positive and recovery is negative. Mean correct probability improves versus stage constants; competence/core remain. Liu budget equivalence fails, restricting causal interpretation to generic conditions."
boundary = "Frozen affine networks and exposed panels; budget-only calibration. No from-scratch training, reliability-gate necessity, main-model promotion or compact requalification."

