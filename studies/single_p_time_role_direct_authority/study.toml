schema_version = 1
id = "single_p_time_role_direct_authority"
title = "Single-P time-role decomposition under one direct arithmetic authority"
chapter = "algorithmic_compression"
order = 1240
status = "unresolved"
review_state = "indexed"
question = "Can the frozen single-P time-role diagnostic become internally interpretable by first freezing a self-reproducible 32D direct baseline that preserves every parent external classification?"
finding = "The direct baseline is incompatible with its frozen external gate: after bitwise direct replay and intact-margin checks passed for the first unit, generic CE differed from the parent by 5.29e-08, above the registered 1e-10 tolerance, so execution stopped before baseline locking or Stage 1--3."
boundary = "This does not establish a changed parent classification or any time-role mechanism; those analyses were not reached. It only rejects the registered external-identity gate, while the parent remains time_removal_failure."

