schema_version = 1
id = "pl_crosstalk_decomposition"
title = "Exact P/L retained cross-talk decomposition"
chapter = "algorithmic_compression"
order = 1210
status = "supporting"
review_state = "indexed"
question = "Can the frozen retained dual-minus-shared probability cost in clean P/L seeds 3004--3006 be reconstructed exactly from omitted-source address overlap, scalar L gain, and each network's fixed operating point?"
finding = "The repaired exact decomposition passed every locked integrity check. Gain-free omitted-write cross-talk was identical across seeds; seed 3006's threshold crossing was a joint gain-by-operating-point boundary, with operating point accounting for 84.8% and 97.9% of its retained-mean difference from seeds 3004 and 3005. The 3004 gain rescued the 3006 gate while the 3005 gain did not, and the 3006 gain passed at both other operating points. Cross-talk was concentrated in few source collisions (median top-one share 0.768, top-two share 1.000, effective source count 1.522)."
boundary = "The result exactly attributes the frozen retained contrast to omitted writes, fixed nonorthogonal addresses, scalar gain, and shared-margin operating point. It does not revise seed 3006 or the parent all-seed failure, explain why joint training learned those parameters, authorize P/L repair or transport, establish biological stores, or turn a deterministic network comparison into population prevalence."

