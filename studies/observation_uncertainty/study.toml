schema_version = 1
id = "observation_uncertainty"
title = "Observation uncertainty and sign-restored control"
chapter = "algorithmic_compression"
order = 1060
status = "mixed"
review_state = "indexed"
question = "Does uncertainty in relation direction, beyond paired absolute-amplitude distortion, allow a jointly trained shared RNN to form stable individualized relations and learn history-dependent functional discrimination?"
finding = "Acute observation noise passed full/global behavioral core and evidence binding in all three paired seeds. Noise-adapted training improved generic CE in all three, retained full core in one seed and global core in none, and failed the registered added-history-discrimination contrast with negative intervals in all three. One fixed sigma; no promotion."
boundary = "Development; one fixed observation-error scale, sign-restored oracle control, three paired network seeds, single-stage joint training; no human calibration or promotion."

