schema_version = 1
id = "minimal_single_p"
title = "Subtractive simplification of the clean single-P learner"
chapter = "algorithmic_compression"
order = 1270
status = "supporting"
review_state = "indexed"
question = "How far can the clean no-time single-P recurrent learner be simplified in architecture and optimization while retaining generic relational competence, causal dependence on P, and globally coherent query structure without human-target fitting?"
finding = "C0, M1, and M2 each passed all three human-blind generic panels in all three development seeds. The terminal-P penalty and dense alpha are unnecessary for the registered functional gates, and M3 is authorized; later levels remain unexposed."
boundary = "This protocol omits no-clipping M4 and microstep-reduction M6 by explicit user decision, retains P clipping and four-support/two-query microsteps, and forbids Liu or human evaluation during development. It can establish only a simplification boundary along the registered ladder, not global minimality or population prevalence."

