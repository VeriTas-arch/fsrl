schema_version = 1
id = "minimal_relational_learner"
title = "Minimal metric-error relational learner"
chapter = "minimal_models"
order = 10
status = "confirmed"
review_state = "indexed"
question = "Can a compact online score learner, with or without direct relational memory, explain the Liu behavioral map?"
finding = "All three paired training streams yield score_only_sufficient: the independently fitted two-scalar, 15-state learner passes competence and all nine qualitative behavior rules. All six fits pass those rules, but each matches only three of nine frozen quantitative classifiers. The trace passes all five local-support rules and improves omitted probability, while reducing nonlearned probability; it is useful but not required for this registered qualitative sufficiency. The fixed comparison is complete and frozen."
boundary = "Sufficiency for the frozen qualitative criteria under imposed additive geometry and inherited encoding/temperature, not quantitative Liu equivalence, universal minimality, old-network trajectory compression, or human confirmation. Three paired training streams are not independent random backbones; no post-result tuning or seed expansion."

