question = "Can a directly trained single-P affine plastic RNN remove the legacy input, output, time, value-head, local-memory, and blank-step scaffolding while preserving competence, evidence binding, organized individual behavior, and observation-training compensation?"
finding = "Both structures were competent and evidence-bound in all three paired seeds. Removing normalized time passed every registered gate in seeds 3012 and 3013, but seed 3011 failed Ce noninferiority for generic learned, generic nonlearned, and Liu omitted probability; the registered all-seed outcome is time_removal_failure."
boundary = "This is a fixed H=200 three-seed development result: it rejects all-seed admission of the registered no-time recipe, not single-P competence, the possibility of another prospectively registered protocol, or a cognitive role for time. It does not authorize seed repair, capacity compression, automatic promotion, checkpoint deletion, or human neural identification."

