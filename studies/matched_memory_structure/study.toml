schema_version = 1
id = "matched_memory_structure"
title = "Information-matched single-stage RNN memory structure"
chapter = "algorithmic_compression"
order = 1010
status = "mixed"
review_state = "indexed"
question = "Does an independently addressed local trace add functional value after information-matched joint retraining?"
finding = "Registered outcome: both_fail_core. All six models are competent and all nine paired direct/nonlearned/omitted contrasts pass single-arm noninferiority, but every N=8 candidate fails individual diversity. No stable added local-trace benefit is identified under the shared effective-evidence interface. All 18 size-by-model cells retain task competence; the individualization deficit persists. The comparison is frozen, without main-model promotion or automatic repair."
boundary = "Fixed H=200 and generic training budget; union-of-evidence input hypothesis; no universal necessity, human confirmation, or automatic promotion."

