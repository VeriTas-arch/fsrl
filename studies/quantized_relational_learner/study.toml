schema_version = 1
id = "quantized_relational_learner"
title = "Four-valued relational teaching codes"
chapter = "minimal_models"
order = 40
status = "mixed"
review_state = "indexed"
question = "Can fixed four-valued encoding repair the score learner's complete Liu behavior, and is persistent code reuse distinguishable from fresh quantization?"
finding = "All nine source/artifact-locked fits passed generic competence, evidence binding and all nine original qualitative rules. Exact, Persistent and Resampled each matched 2/9, 4/9 and 8/9 original quantitative rows across all three paired training streams; all recipes are partial_behavioral_reproduction. Resampled misses the unchanged distance-slope interval; Persistent overproduces incorrect rankings. No recipe is eligible for unchanged replication or main-model promotion. The fixed matrix is complete and frozen."
boundary = "Two-bit code content is an imposed resource hypothesis, not human capacity or total model memory. The frozen candidate cannot be repaired after evaluation; pilot success alone cannot promote the main model."

