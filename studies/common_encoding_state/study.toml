schema_version = 1
id = "common_encoding_state"
title = "Marginally matched common encoding state"
chapter = "minimal_models"
order = 72
status = "frozen_contract"
review_state = "indexed"
question = "Does an episode-level common encoding state improve joint ranking composition beyond a marginally matched relation-shared control while preserving the replicated global-decay learner?"
finding = "A prospective three-condition development test is registered; rho must first be selected by non-Liu model recovery, and no common-state outcome has been observed."
boundary = "This study changes only the joint dependence of stochastic four-valued encoding. It does not change any single-presentation code distribution, the global decay rule, readout, temperature or task information, and it cannot promote a main model without fresh replication and a separate biological-boundary test."

