id = "single_p_time_role_propagated_authority"
title = "Single-P time-role decomposition with propagated numerical authority"
chapter = "algorithmic_compression"
order = 1250
status = "frozen_contract"
review_state = "indexed"
question = "Can a full-shape 32D direct baseline preserve the clean single-P parent under analytically propagated numerical error budgets and thereby admit the frozen time-role mechanism diagnostic?"
finding = "A no-training successor contract is frozen. It propagates the registered margin tolerance through probability, CE, participant aggregation, contrasts, bootstrap draws and intervals; separately requires exact discrete scientific classifications; and makes batch shape part of the arithmetic authority."
boundary = "This protocol is not a baseline or mechanism result, cannot revise the predecessor's baseline_incompatible outcome or the parent's time_removal_failure, and assigns no time-role label before its registered gates execute."

