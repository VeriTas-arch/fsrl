name: quality

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  cpu-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install maintained environment
        run: python -m pip install -r requirements.txt
      - name: Validate package and dependencies
        run: |
          python -m pip check
          python -c "import fsrl; print(fsrl.__file__)"
      - name: Lint and format
        run: |
          ruff check fsrl tests tools reproductions
          ruff check fsrl tests tools --select B905
          ruff format --check fsrl tests tools reproductions
      - name: Type-check stable packages
        run: basedpyright
      - name: Validate registries and workflows
        run: |
          python -m fsrl.infra.study_registry check
          python -m fsrl.workflows check workflows/relational_model/workflow.toml
          python -m fsrl.workflows.paper_figures check
      - name: Run bounded CPU test suite
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m fsrl.infra.test_runtime
