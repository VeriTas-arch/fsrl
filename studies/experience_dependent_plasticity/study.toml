schema_version = 1
id = "experience_dependent_plasticity"
title = "Experience-dependent score plasticity"
chapter = "minimal_models"
order = 70
status = "confirmed"
review_state = "indexed"
question = "Can repeated-evidence plasticity stabilization improve complete internal order formation and ranking composition in the two-scalar Resampled score learner?"
finding = "Across paired seeds 2117--2119 and 400 locked Liu cohorts per fit, global blockwise diminishing plasticity improves internal strict ordering, reduces inversions and moves the joint ranking composition toward the human reference while preserving the registered competence/core profile. Relation-addressed efficacy is not supported over the simpler global scheduler."
boundary = "Confirmed and independently reconstructed for this fixed three-seed development pilot: declining within-episode plasticity is a supported single-stage candidate mechanism, not relation familiarity. The result is claim-relative rather than full-distribution equality: self-consistent incorrect rankings remain high and the legacy full-nine quantitative profile does not pass. No main-model promotion follows without unchanged fresh replication and a separately authorized circuit boundary test."

