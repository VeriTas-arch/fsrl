schema_version = 1
id = "joint_training_strategy"
title = "Matched single-stage versus staged training"
chapter = "algorithmic_compression"
order = 1000
status = "mixed"
review_state = "indexed"
question = "Can a shared query objective preserve global assembly, direct fidelity, and Liu behavior without staged optimization?"
finding = "All six matched staged/joint models are competent; all three joint networks preserve nine qualitative behavior rows and improve nonlearned correct probability. Registered outcome: competent_but_not_noninferior, because seed 2108 omitted NI has lower bound -0.0270 versus -0.02. Both schedules fail the retained local-benefit materiality gate in every seed, despite positive effects; the other four causal links and omitted rescue pass. Joint preserves all six named quantitative behavior rows in 2108/2110, not 2109, and is slower at equal episode exposure. The complete comparison is frozen with no automatic tuning or seed expansion."
boundary = "This new candidate tests a fixed training recipe under imposed P/L structural priors. It does not replace frozen v2.4 evidence, establish minimal architecture or human neural learning, or identify an order-only effect at equal FLOPs."

