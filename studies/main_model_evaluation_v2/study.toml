id = "main_model_evaluation_v2"
title = "Claim-relative single-stage main-model evaluation"
chapter = "minimal_models"
order = 60
status = "supporting"
review_state = "indexed"
question = "How should core Liu-mechanism adequacy be distinguished from strict full quantitative fidelity, and what do the frozen Resampled outputs imply for the next minimal single-stage learner?"
finding = "All three frozen Resampled fits retrospectively satisfy the added core-behavior layer while retaining their legacy 8/9 quantitative pilot status. Internal strict correctness is only about 3.4%, and sampled choice has no directional net effect on correct-ranker prevalence; ranking-composition TV is about 0.118. This supports targeting the update rule before the readout, while retaining sampling inconsistency as a separate boundary."
boundary = "Retrospective evaluation of exposed simulations, not prospective validation of the new 0.90 threshold, full quantitative fidelity, human latent-state measurement or main-model promotion. No training, calibration, candidate repair or human fitting occurred."

