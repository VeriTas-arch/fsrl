[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py312"
extend-exclude = ["addons", "archive", "synthesis/frozen"]

# These original runtime files are source-locked by historical studies. Keep
# their exact bytes and make the pre-existing lint debt explicit instead of
# allowing an editor action to rewrite scientific provenance.
[tool.ruff.lint.per-file-ignores]
"fsrl/cli.py" = ["I001"]
"fsrl/config.py" = ["I001"]
"fsrl/episode.py" = ["RUF059", "UP032"]
"fsrl/eval_figures.py" = ["I001", "SIM114"]
"fsrl/model.py" = ["PLR0402"]
"fsrl/train.py" = ["FURB122"]

# Formatting is enforced for new code. These pre-existing files form the
# source/provenance formatting baseline and must not be rewritten incidentally.
[tool.ruff.format]
exclude = [
    "fsrl/algorithmic.py",
    "fsrl/confirmation.py",
    "fsrl/conjunctive_local_trace_pilot.py",
    "fsrl/conjunctive_local_trace_replication.py",
    "fsrl/dual_evidence_access_confirmation.py",
    "fsrl/dual_evidence_access_pilot.py",
