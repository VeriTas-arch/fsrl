schema_version = 1
id = "effective_write_cost"
title = "Effective global write cost and learned evidence selection"
chapter = "algorithmic_compression"
order = 1030
status = "mixed"
review_state = "indexed"
question = "Does a fixed budget on effective global fast-connection modification induce useful learned selection under unchanged shared evidence and single-stage joint training?"
finding = "All three paired fits retain competence and reduce effective writes by 71-80%; bridge-history write-share interactions are positive in all three. The registered joint functional-selection gate and Liu core behavior each pass 0/3; limited ranking diversification is retained as positive evidence. N6/10 transport not triggered; isolated remains the working model. Frozen development evidence without main-model promotion."
boundary = "One generic development initialization, conditional three fresh paired initializations; unchanged shared effective evidence and joint training. Global modification proxy, no physiological budget or automatic main-model promotion."

