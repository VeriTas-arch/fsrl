schema_version = 1
id = "score_circuit"
title = "Score-only: finite-time opponent circuit realization"
chapter = "minimal_models"
order = 30
status = "confirmed"
review_state = "indexed"
question = "Can local centered activity and compartment mismatch implement the frozen score learner with bounded nonnegative efficacies at finite time scales?"
finding = "All three exposed frozen score-only fits satisfy conditional_circuit_sufficiency across all locked scales and step sizes. Actual bounded nonnegative efficacies, finite-time compartment mismatch and pooled error gain preserve the original task function; teaching-off and mismatch-clamp give no writes, and shuffled teaching loses competence. All 798 endpoint/interval estimates independently reconstructed. Historical qualitative 9/9 and quantitative 3/9 behavior remain unchanged. Complete and frozen; no training, calibration or main-model promotion."
boundary = "Conditional rate-level circuit sufficiency under explicit centered-activity, opponent-teaching, pooled-gain and external admission assumptions; not full conductance/spike implementation, human confirmation or main-model promotion."

