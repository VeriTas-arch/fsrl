schema_version = 1
id = "minimal_single_p_promotion"
title = "Fresh-cohort promotion test of the minimal single-P M2 recipe"
chapter = "algorithmic_compression"
order = 1275
status = "mixed"
review_state = "indexed"
question = "What generic solution distribution and Liu behavioral phenotype emerge across 20 unfiltered fresh networks trained with the selected minimal single-P M2 recipe?"
finding = "The unfiltered fresh cohort produced 18/20 stable_constructive generic networks, no panel-variable network, and two nonconstructive networks (3041 and 3060). No network met the strict all-panel Liu pilot-compatibility gate: six qualitative rows were broadly stable, but difficult-pair bimodality and stable within-subject errors were absent across all networks, all-panel ranking diversity occurred in only 3/20, and no historical quantitative row passed across all three panels in any network."
boundary = "M2 is a robust but not universal generator of coherent generic relational solutions, and its frozen generic-only training does not naturally reproduce the complete Liu individual-error phenotype. The result cannot justify seed filtering, post-result recipe repair, new human confirmation, biological identification, global architectural minimality, or final main-model promotion; width reduction and fixed-eta tests remain outside scope."

