schema_version = 1
id = "pl_functional_replication"
title = "Clean no-time P/L functional replication"
chapter = "algorithmic_compression"
order = 1200
status = "mixed"
review_state = "indexed"
question = "Can the already-fixed, directly trained clean no-time P/L candidate reproduce the historical v2.4 functional division on fresh networks while retaining task competence and the frozen qualitative behavior phenomena?"
finding = "All three fresh networks passed competence, the global P path, omitted L materiality, and all nine qualitative behavior rules. Seeds 3004 and 3005 passed all four historical v2.4 functional links; seed 3006 passed three links but missed retained-fidelity preservation because the dual-minus-shared retained exact-probability lower bound was -0.00505074 versus the frozen -0.005 threshold, with zero own-write identity error. The all-seed outcome is competent_alternative_organization, so item-count transport was not triggered; quantitative calibration remained report-only at 5/9, 4/9, and 3/9."
boundary = "The clean no-time architecture can realize the intended functional division, but this frozen recipe did not replicate it in all three fresh networks and is not promoted as a reliable clean P/L mainline. Seed 3006 is retained as valid competent variation rather than a tuning target, and seeds 3001--3003 remain the separate training-parameterization failure. The result does not establish biological dual stores, architectural necessity, L necessity for every direct relation, quantitative human equivalence, spontaneous emergence without priors, or network-population prevalence."

