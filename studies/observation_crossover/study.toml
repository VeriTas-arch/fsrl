schema_version = 1
id = "observation_crossover"
title = "Training by observation crossover"
chapter = "algorithmic_compression"
order = 1070
status = "supporting"
review_state = "indexed"
question = "Does observation-error training change baseline relational organization, error-induced population differentiation, and within-subject order displacement in the frozen A/C networks?"
finding = "All three frozen A/C pairs support output-level compensation: positive population-tau interaction, negative generic-global CE interaction and reduced within-subject order displacement, with all four cells competent and evidence-bound. C is less accurate on clean generic inputs; behavioral core allocation remains A0 0/3, Ae 3/3, C0 0/3, Ce 1/3 full and 0/3 global. Diagnostic development, no promotion."
boundary = "Three previously trained paired networks; three exposed cells and one prospectively frozen cross-evaluation; no training, human calibration or promotion."

