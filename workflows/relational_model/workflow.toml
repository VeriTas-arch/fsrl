schema_version = 2
id = "relational_model"
status = "working"
title = "Relational model mainline"
purpose = "A reproducible route from the task information boundary through the maintained global/local computation to registered evidence and report-facing figures."
working_claim = "Sparse signed evidence feeds a meta-learned fast-weight state for global assembly and a query-addressed local trace with broader evidence admission for direct fidelity."
boundary = "This workflow organizes the current model and its evidence; it does not turn the model into a claim about human neural implementation, erase valid negative studies, or supersede frozen study contracts."
study_registry = "studies/README.md"
synthesis = "synthesis/README.md"
figure_root = "synthesis/figures"

[execution]
default_profile = "GPU, torch.compile backend=inductor, fullgraph=true, mode=default"
pilot_seed_rule = "Use one to three development seeds before freezing any formal multi-seed protocol."
formal_rule = "Lock all mandatory artifacts before evaluation and analyze participants within each network."

[[stages]]
id = "task_contract"
title = "Task and evidence contract"
question = "What information enters the model, and what is deliberately withheld?"
method = "Represent each support event by item identity plus signed displayed magnitude, with passive presentation and no query label or test feedback in the input."
finding = "The maintained task adapter preserves the experimental information boundary while allowing explicit subject-level evidence admission."
boundary = "Any omission, attenuation, or broader local admission is a model hypothesis rather than a restatement of the task."
depends_on = []
implementation = ["fsrl/tasks/protocol.py", "fsrl/tasks/sparse_ranking.py", "fsrl/tasks/evidence.py", "fsrl/core/inputs.py"]
tests = ["tests/tasks/test_protocol.py", "tests/tasks/test_meta_tasks.py"]
studies = ["task_fidelity"]

[[stages.evidence]]
study = "task_fidelity"
record = "records/benchmarks/liu_v2.json"
use = "defines"
description = "Frozen task interface and information boundary used by the maintained model evaluation."

[[stages.verification]]
id = "task_contract_tests"
resource = "cpu"
argv = ["direnv", "exec", ".", "python", "-m", "unittest", "tests.tasks.test_protocol", "tests.tasks.test_meta_tasks"]

[[stages]]
id = "global_backbone"
title = "Global fast-weight backbone"
question = "Can a shared recurrent learner assemble unseen sparse relational graphs?"
method = "Meta-train the plastic recurrent backbone on generic connected ranking graphs while prospectively holding out the evaluation graph family."
finding = "Held-out transfer and fast-weight necessity establish a competent global relational assembly substrate."
boundary = "Competence does not by itself identify the algorithm or reproduce every human behavioral statistic."
depends_on = ["task_contract"]
implementation = ["fsrl/core/plastic_rnn.py", "fsrl/training/backbone.py", "fsrl/training/checkpoints.py", "fsrl/evaluation/frozen_fast_weight.py", "fsrl/infra/runtime.py"]
tests = ["tests/training/test_backbone.py", "tests/evaluation/test_frozen_fast_weight.py"]
studies = ["development_qualification", "formal_behavioral_confirmation"]

[[stages.evidence]]
study = "development_qualification"
record = "records/results/dev_v2_seed1801_step1000.json"
json_pointer = "/causal_qualification/status"
use = "supports"
description = "The development checkpoint passes the held-out causal qualification gate."

[[stages.evidence]]
study = "formal_behavioral_confirmation"
record = "records/results/confirmation_v1.json"
json_pointer = "/pass_rates/causal_qualification_pass_proportion"
use = "supports"
description = "All ten declared formal networks pass causal qualification without seed filtering."

[[stages.evidence]]
study = "formal_behavioral_confirmation"
record = "records/results/confirmation_v1.json"
json_pointer = "/pass_rates/behavioral_confirmation_pass_proportion"
use = "constrains"
description = "The full behavioral conjunction fails in every formal network and remains a model boundary."

[[stages.verification]]
id = "global_backbone_tests"
resource = "cpu"
argv = ["direnv", "exec", ".", "python", "-m", "unittest", "tests.training.test_backbone", "tests.evaluation.test_frozen_fast_weight"]

[[stages]]
id = "global_mechanism"
title = "Global assembly mechanism"
question = "How does the fast-weight state transform retained evidence into a coherent global field?"
method = "Use registered causal ablations, write-factor swaps, trajectory analyses, and expected-rank versus MAP geometry without changing the frozen evaluator."
finding = "Evidence-specific writes accumulate through a meta-learned recurrent sensitivity landscape toward an expected-rank-like global potential."
boundary = "The complete DA direction-preservation chain is heterogeneous, and the model is not a sequential Bayesian updater."
depends_on = ["global_backbone"]
implementation = ["fsrl/evaluation/frozen_fast_weight.py", "fsrl/analysis/hodge.py", "fsrl/analysis/statistics.py", "fsrl/experiments/assembly/trajectory.py", "fsrl/experiments/assembly/factor_swap.py", "fsrl/experiments/confirmation/mechanism.py"]
tests = ["tests/experiments/assembly/test_trajectory.py", "tests/experiments/assembly/test_factor_swap.py", "tests/experiments/confirmation/test_mechanism.py"]
studies = ["assembly_trajectory", "support_factor_swap", "mechanism_confirmation"]

[[stages.evidence]]
study = "assembly_trajectory"
record = "records/results/assembly_trajectory_v1.json"
json_pointer = "/overall_diagnosis/episode_specific_global_reassembly_replicated_across_pilot_seeds"
use = "supports"
description = "Episode-specific global reassembly replicates across both diagnostic pilots."

[[stages.evidence]]
study = "support_factor_swap"
record = "records/results/support_factor_swap_v1.json"
json_pointer = "/overall_diagnosis/eligibility_identity_transfer_replicated_across_pilot_seeds"
use = "supports"
description = "Matched eligibility transfers evidence-specific direction across both pilots."

[[stages.evidence]]
study = "mechanism_confirmation"
record = "records/results/mechanism_confirmation_v1.json"
json_pointer = "/linkwise_confirmation/immediate_and_episode_global_reassembly/status"
use = "supports"
description = "Immediate and episode-level global reassembly confirms across all formal seeds."

[[stages.evidence]]
study = "mechanism_confirmation"
record = "records/results/mechanism_confirmation_v1.json"
json_pointer = "/linkwise_confirmation/da_gain_with_direction_preservation/status"
use = "constrains"
description = "DA magnitude confirms but direction preservation remains unresolved because of seed heterogeneity."

[[stages.verification]]
id = "global_mechanism_tests"
resource = "cpu"
argv = ["direnv", "exec", ".", "python", "-m", "unittest", "tests.experiments.assembly.test_trajectory", "tests.experiments.assembly.test_factor_swap", "tests.experiments.confirmation.test_mechanism"]

[[stages]]
id = "local_mechanism"
title = "Query-addressed local fidelity"
question = "What preserves direct experience when nonlinear global expression loses local correctness?"
method = "Accumulate a fixed antisymmetric conjunctive trace and read it only through the matching query address, with explicit P-off and L-off interventions."
finding = "Independent backbones replicate a direct-enriched local rescue and a causal P/L double dissociation."
boundary = "The evidence supports the computation, not a unique tensor-product code or biologically separate memory store."
depends_on = ["task_contract", "global_backbone"]
implementation = ["fsrl/core/local_trace.py", "fsrl/core/relational_system.py", "fsrl/core/state.py", "fsrl/experiments/local_fidelity/trace_replication.py", "fsrl/experiments/local_fidelity/behavior_attribution.py"]
tests = ["tests/core/test_local_trace.py", "tests/core/test_relational_system.py", "tests/experiments/local_fidelity/test_trace_replication.py", "tests/experiments/local_fidelity/test_behavior_attribution.py"]
studies = ["conjunctive_local_trace_replication", "local_behavior_attribution"]

[[stages.evidence]]
study = "conjunctive_local_trace_replication"
record = "records/results/conjunctive_local_trace_replication_v2_3.json"
json_pointer = "/decision/outcome"
use = "supports"
description = "All four local/global causal links replicate independently on seeds 2102 and 2103."

[[stages.evidence]]
study = "local_behavior_attribution"
record = "records/results/local_behavior_attribution_v2_3.json"
json_pointer = "/decision/outcome"
use = "supports"
description = "Exact-probability attribution resolves the sampled-endpoint sensitivity without changing the mechanism."

[[stages.verification]]
id = "local_core_tests"
resource = "cpu"
argv = ["direnv", "exec", ".", "python", "-m", "unittest", "tests.core.test_local_trace", "tests.core.test_relational_system"]

[[stages.verification]]
id = "local_evidence_tests"
resource = "cpu"
argv = ["direnv", "exec", ".", "python", "-m", "unittest", "tests.experiments.local_fidelity.test_trace_replication", "tests.experiments.local_fidelity.test_behavior_attribution"]

[[stages]]
id = "differential_admission"
title = "Differential evidence admission"
question = "Can weak observed evidence persist locally when it is not admitted to global assembly?"
method = "Keep the P and L update/readout mechanisms fixed, use selective effective evidence for P, and use z + (1-z)p for the local write."
finding = "Four independent backbones confirm omitted direct-fidelity rescue with evidence and query specificity while global inference remains P-dependent."
boundary = "The broader local writes have a small replicated retained cross-talk cost and do not repair the excessive global distance slope."
depends_on = ["global_mechanism", "local_mechanism"]
implementation = ["fsrl/tasks/evidence.py", "fsrl/core/relational_system.py", "fsrl/experiments/local_fidelity/evidence_access_pilot.py", "fsrl/experiments/local_fidelity/evidence_access_confirmation.py"]
tests = ["tests/core/test_relational_system.py", "tests/experiments/local_fidelity/test_evidence_access_pilot.py", "tests/experiments/local_fidelity/test_evidence_access_confirmation.py"]
studies = ["dual_evidence_access_pilot", "dual_evidence_access_confirmation"]

[[stages.evidence]]
study = "dual_evidence_access_pilot"
record = "records/results/dual_evidence_access_pilot_v2_4.json"
json_pointer = "/decision/outcome"
use = "supports"
description = "The zero-parameter differential-admission rule passes all four development links."

[[stages.evidence]]
study = "dual_evidence_access_confirmation"
record = "records/results/dual_evidence_access_confirmation_v2_4.json"
json_pointer = "/decision/outcome"
use = "supports"
description = "The unchanged rule confirms on two fresh backbones after joint artifact locking."

[[stages.evidence]]
study = "dual_evidence_access_confirmation"
record = "records/results/dual_evidence_access_confirmation_v2_4.json"
json_pointer = "/claim_boundary"
use = "constrains"
description = "The result preserves the retained cross-talk cost, slope mismatch, and non-population claim boundary."

[[stages.verification]]
id = "differential_admission_tests"
resource = "cpu"
argv = ["direnv", "exec", ".", "python", "-m", "unittest", "tests.experiments.local_fidelity.test_evidence_access_pilot", "tests.experiments.local_fidelity.test_evidence_access_confirmation", "tests.core.test_relational_system"]

[[stages]]
id = "algorithm_and_transport"
title = "Algorithmic form and transport"
question = "Which parts of the working model compress exactly, and where does it transport?"
method = "Reduce the local state to an exact edge ledger plus Gram geometry and test the unchanged causal links across support topology, order, sparsity, and item count."
finding = "The local computation has an exact reduction and the structural mechanism transports broadly; tested low-dimensional global reductions remain insufficient."
boundary = "Evidence-density prevalence has an unresolved boundary, and no tested compact global state is yet sufficient."
depends_on = ["differential_admission"]
implementation = ["fsrl/core/relational_system.py", "fsrl/analysis/hodge.py", "fsrl/experiments/reduction/dual_state_v1.py", "fsrl/experiments/reduction/dual_state_v2.py", "fsrl/experiments/reduction/dual_state_v3.py", "fsrl/experiments/reduction/functional_latent.py", "fsrl/experiments/transport/topology.py", "fsrl/experiments/transport/presentation_order.py", "fsrl/experiments/transport/evidence_sparsity.py", "fsrl/experiments/transport/sparsity_individualization.py", "fsrl/experiments/transport/item_count.py"]
tests = ["tests/analysis/test_algorithmic.py", "tests/experiments/reduction/test_dual_state_v1.py", "tests/experiments/reduction/test_dual_state_v2.py", "tests/experiments/reduction/test_dual_state_v3.py", "tests/experiments/reduction/test_functional_latent.py", "tests/experiments/transport/test_topology.py", "tests/experiments/transport/test_presentation_order.py", "tests/experiments/transport/test_evidence_sparsity.py", "tests/experiments/transport/test_sparsity_individualization.py", "tests/experiments/transport/test_item_count.py"]
studies = ["dual_state_reduction_v1", "dual_state_reduction_v2", "dual_state_reduction_v3", "functional_fast_weight_latent_sufficiency", "asymmetric_algorithmic_organization", "support_topology_transport", "presentation_order_transport", "evidence_sparsity_transport", "sparsity_individualization_localization", "item_count_transport"]

[[stages.evidence]]
study = "dual_state_reduction_v1"
