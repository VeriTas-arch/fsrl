id = "pl_direct_training"
title = "Direct training of the cleaned no-time P/L model"
chapter = "algorithmic_compression"
order = 1190
status = "valid_negative"
review_state = "indexed"
question = "Can optimizer-equivalent direct training recover the cleaned P/L organization, and does removing normalized episode time preserve its competence, causal links, and inherited behavior profile?"
finding = "Fresh direct training made both conditions competent in all three development seeds, and the no-time candidate passed paired noninferiority on all six registered endpoints. Both conditions nevertheless failed retained direct-local fidelity in every seed (bootstrap lower bounds 0.00383--0.00505 versus the registered 0.01 threshold) and failed the frozen quantitative behavior gate. The registered outcome is training_parameterization_failure, so confirmation stops without tuning."
boundary = "This rejects the fixed direct-training recipe as a route to a reportable P/L mainline. It does not identify normalized time as the cause because the no-time candidate was noninferior and both conditions failed the same mandatory mechanism link; it does not reject the no-time architecture generally, authorize protocol tuning, or authorize historical checkpoint deletion."

