schema_version = 1
id = "single_p_time_role_propagated_authority"
title = "Single-P time-role decomposition with propagated numerical authority"
chapter = "algorithmic_compression"
order = 1250
status = "supporting"
review_state = "indexed"
question = "Can a full-shape 32D direct baseline preserve the clean single-P parent under analytically propagated numerical error budgets and thereby admit the frozen time-role mechanism diagnostic?"
finding = "The full-shape propagated baseline is compatible and the repaired frozen mechanism diagnostic is interpretable. One positive margin scale remains insufficient for seed 3011 because generic nonlearned and Liu omitted lower bounds remain below -0.02. Support-time and query-time paths are present in all three seeds with bitwise-identical terminal P under query interventions. Both architectures show state-dependent plasticity in every seed, but all six preregistered confidence-link intervals are positive rather than negative, so that link is not supported; the registered labels are not heterogeneous across seeds."
boundary = "This localizes normalized time as an active support-update and query-read input in the retained controls, not a sufficient scalar calibration or a necessary source of state-dependent plasticity. Acute time interventions are not equivalent to retraining without time; the confidence result rejects only the registered negative-link proxy. The three fixed-H=200 networks do not establish a human or biological mechanism, and the parent remains time_removal_failure."

