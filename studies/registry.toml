schema_version = 1
id = "study-registry-v1"
review_state = "indexed"
source_import_commit = "fb32095df70b1265b5d14b8eda3be6cb65036c6a"
evidence_source_ref = "refs/tags/liu-mainline-v1"
record_catalog = "catalogs/record-catalog-v2.json"
migration = "migrations/flat-records-v1.json"
migrations = ["migrations/flat-records-v1.json", "migrations/synthesis-snapshot-v1.json"]

[storage_policy]
inline_review_threshold_bytes = 5000000
inline_hard_limit_bytes = 20000000
historical_inline_source_refs = ["refs/tags/liu-mainline-v1"]
future_large_payload_backends = ["content_addressed_bundle", "release_asset", "git_lfs"]

[status_legend]
frozen_contract = "Task or evaluation boundary used by later studies; not itself a mechanism result."
confirmed = "Positive result supported by the registered controls in its stated seed scope."
supporting = "Valid evidence used to localize or constrain a mechanism, without closing the full question."
mixed = "Contains important positive evidence and a registered failure or unresolved primary link."
valid_negative = "Competence-qualified negative that rejects or closes the registered candidate family."
unresolved = "The registered test did not identify a unique or sufficient explanation."
transported = "The registered mechanism transported across the stated one-factor boundary."
historical = "Development or qualification evidence retained for provenance, not the current headline result."
deferred = "Prospectively prepared work that is outside the current model-focused program."
context = "Source or background material; not a node in the model evidence chain."

[record_role_legend]
artifact_bundle = "Content-addressed archive used to restore multiple frozen runtime members."
artifact_lock = "Pre-evaluation identity lock over runtime artifacts."
artifact_registry = "Frozen mapping from logical artifact identities to storage members."
canonical_mainline_manifest = "Frozen claim, execution, and evidence manifest for a reporting snapshot."
data_schema = "Machine-readable schema for prospectively collected raw data."
environment_contract = "Descriptive or reconstructable execution-environment contract."
execution_lock = "Prospectively frozen execution and implementation contract."
freeze_validation = "Validation record produced when a reporting object was frozen."
frozen_parameters = "Write-once fitted parameters retained independently of a result summary."
frozen_result = "Canonical immutable result for one registered study."
mainline_guide = "Human guide belonging to a frozen reporting snapshot."
noninterpretable_attempt = "Failed or invalid attempt retained without evidential interpretation."
presentation_asset = "Deterministic table or figure used only for presentation."
presentation_view = "Frozen mapping from report elements to exact evidence locators."
randomization_record = "Deterministic randomization object for prospective collection."
readiness_result = "Result of a prospective collection or execution readiness audit."
registered_contract = "Frozen protocol, estimand, control, or decision contract."
repair_contract = "Append-only correction to a registered contract."
repair_lock = "Execution lock associated with an append-only repair contract."
report = "Human-readable study or snapshot report."
source_context = "Byte-preserved external paper or contextual source."
superseded_repair_source = "Historical pre-repair result retained for provenance."
supporting_artifact = "Compact binary numerical artifact required to interpret or replay a result."
validation_result = "Machine-readable validation result that is not itself a study estimand."

[[chapters]]
id = "orientation"
order = 0
title = "Start here: task and frozen reporting object"
purpose = "Establish the Liu information boundary and the current frozen reporting-level claim map."

[[chapters]]
id = "competence"
order = 10
title = "Behavioral competence and formal confirmation"
purpose = "Separate what the model reproduces from the behavioral mismatches that remain constraints."

[[chapters]]
id = "global_assembly"
order = 20
title = "Global relational assembly"
purpose = "Trace the evidence from additive policy geometry to the state-dependent fast-weight computation P_T."

[[chapters]]
id = "local_fidelity"
order = 30
title = "Direct local fidelity"
purpose = "Follow the diagnostic route from failed expression corrections to the replicated local edge state and differential evidence admission."

[[chapters]]
id = "global_policy"
order = 40
title = "Global-policy mismatch and comparator boundary"
purpose = "Localize the excessive distance slope, preserve the replicated field fingerprint, and record why the comparator cannot license a neural intervention."

[[chapters]]
id = "algorithmic_compression"
order = 50
title = "Algorithmic compression"
purpose = "Distinguish the exact local edge-ledger reduction from registered global reductions that fail to close the dynamics."

[[chapters]]
id = "structural_transport"
order = 60
title = "One-factor structural transport"
purpose = "Test topology, presentation order, evidence density, and item count without silently upgrading them into arbitrary-domain guarantees."

[[chapters]]
id = "minimal_models"
order = 55
title = "Minimal explanatory models"
purpose = "Test simpler task-level learners independently of reconstructing frozen recurrent trajectories."

[[chapters]]
id = "deferred_human"
order = 70
title = "Human validation work, currently deferred"
purpose = "Preserve the completed comparator boundary and prepared magnitude-placement protocol without mixing them into the current model program."

[[chapters]]
id = "context"
order = 80
title = "Source and theoretical context"
purpose = "Keep source papers visible while keeping them outside the factual model-evidence DAG."

[[views]]
id = "diagnostic_lineage"
title = "Diagnostic lineage"
purpose = "How the project moved from a competent global-only model to the P_T/a_T mechanism while preserving valid negative results."
studies = ["formal_behavioral_confirmation", "assembly_diagnostics", "assembly_trajectory", "support_write_localization", "support_factor_swap", "history_state_factorial", "hidden_residual_audit", "relation_trace_localization", "state_query_operator_binding", "operator_output_semantics", "operator_amplitude_path", "curvature_gate", "policy_opposition_gate", "policy_residual", "conjunctive_local_trace_pilot", "local_behavior_attribution", "conjunctive_local_trace_replication", "dual_evidence_access_pilot", "dual_evidence_access_confirmation"]

[[views]]
id = "closed_families"
title = "Closed candidate families"
purpose = "Valid negative routes that should not be reopened without contradictory evidence or a separately frozen scientific question."
studies = ["curvature_gate", "policy_opposition_gate", "policy_residual", "dual_state_reduction_v1", "dual_state_reduction_v2", "dual_state_reduction_v3", "functional_fast_weight_latent_sufficiency", "human_metric_constructive_comparator"]

[[views]]
id = "open_boundaries"
title = "Preserved unresolved boundaries"
purpose = "Results that constrain the current claim and should remain visible in reporting rather than being averaged away."
studies = ["behavior_reproduction_map", "global_policy_amplitude_provenance", "global_policy_field_reassembly", "global_policy_allocation_audit", "global_policy_comparator_adequacy", "evidence_sparsity_transport", "sparsity_individualization_localization", "item_count_transport"]

[[views]]
id = "deferred_programs"
title = "Deferred human-validation route"
purpose = "Completed boundary work and prepared acquisition materials that are intentionally outside the current model-only focus."
studies = ["global_policy_comparator_adequacy", "human_metric_constructive_comparator", "magnitude_placement_human_program"]

