schema_version = 1
id = "observation_replication"
title = "Independent observation replication"
chapter = "algorithmic_compression"
order = 1080
status = "supporting"
review_state = "indexed"
question = "Do acute observation-induced organized individuality and training-dependent output compensation replicate jointly in new paired networks crossed with new simulated panels?"
finding = "Independent 3-pair x 3-panel replication: acute core 9/9 full/global; all three equal-panel summaries support output compensation, with 8/9 panelwise joint intervals and one uncertain order-shift contrast. Noisy-trained core 6/9 full/global; original-input CE cost and noisy-input benefit persist."
boundary = "Three new paired training instances crossed with three new simulated panels; no network pooling, human confirmation or promotion."

