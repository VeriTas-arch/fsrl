schema_version = 1
id = "single_p_time_role_propagated_authority"
title = "Single-P time-role decomposition with propagated numerical authority"
chapter = "algorithmic_compression"
order = 1250
status = "frozen_contract"
review_state = "indexed"
question = "Can a full-shape 32D direct baseline preserve the clean single-P parent under analytically propagated numerical error budgets and thereby admit the frozen time-role mechanism diagnostic?"
finding = "The frozen propagated-authority baseline is compatible across all 72 evaluation units: 18144 summary values and 1824000 bootstrap-draw values remain inside their analytic budgets, all 4674 discrete classification leaves match exactly, and the parent time_removal_failure is unchanged. The first mechanism attempt exposed no estimate and stopped on an invalid bootstrap-count lookup; its inherited-authority-only repair has passed synthetic qualification, and the mechanism diagnostic remains pending."
boundary = "Baseline compatibility admits the registered mechanism diagnostic but does not itself assign a time-role label, revise the parent's time_removal_failure, or authorize training. The result is conditional on the frozen full-batch arithmetic authority and locked 24.9 GB runtime artifact set."

