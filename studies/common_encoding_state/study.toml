schema_version = 1
id = "common_encoding_state"
title = "Marginally matched common encoding state"
chapter = "minimal_models"
order = 72
status = "mixed"
review_state = "indexed"
question = "Does an episode-level common encoding state improve joint ranking composition beyond a marginally matched relation-shared control while preserving the replicated global-decay learner?"
finding = "The fixed 2120--2122 substitutions and independently trained 2123--2125 fits all preserve the global-decay learner, but episode-common encoding fails the registered specificity contrast against the marginally matched relation-common control in every network. The registered outcome is joint_structure_unresolved."
boundary = "This completed development result does not support episode-wide common encoding as the missing joint-error mechanism and does not promote a main model. Marginal quantization, global decay, readout, temperature and task information remained fixed; no rho, codebook, loss, threshold, seed or checkpoint repair is authorized after exposure."

