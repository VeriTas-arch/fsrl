[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fsrl-relational-model"
version = "0.1.1"
description = "Plastic recurrent models for relational learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26",
    "matplotlib>=3.11",
    "numpy>=2.4",
    "scipy>=1.18",
    "threadpoolctl>=3.6",
    "torch>=2.13",
]

[project.optional-dependencies]
reproduction = [
    "scikit-learn>=1.9",
    "tqdm>=4.67",
]
test = [
    "basedpyright>=1.39",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
include = ["fsrl*"]

[tool.setuptools.package-data]
"fsrl.experiments.transport" = ["contracts/*.json"]

[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py312"
extend-exclude = [
    "reproductions/relational_learning_2024/upstream/base/main.ipynb",
    "reproductions/relational_learning_2024/upstream/base/simple.ipynb",
    "reproductions/relational_learning_2024/upstream/addons/TI_FrozenWin.ipynb",
]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]

[tool.basedpyright]
include = ["fsrl"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = [
    "fsrl/evaluation/contracts.py",
    "fsrl/evaluation/execution.py",
    "fsrl/evaluation/metrics.py",
    "fsrl/evaluation/sampling.py",
    "fsrl/evaluation/subject_encoding.py",
    "fsrl/infra/run_manifest.py",
]
