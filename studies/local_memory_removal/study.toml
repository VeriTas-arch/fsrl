schema_version = 1
id = "local_memory_removal"
title = "Local-memory removal under observation uncertainty"
chapter = "algorithmic_compression"
order = 1090
status = "supporting"
review_state = "indexed"
question = "Can the independent local memory be removed during joint training while preserving direct experience, relational competence, organized individuality and observation-training compensation?"
finding = "All three paired single-memory A/C instances support local-state removal under the frozen developmental criterion: Ce five-endpoint noninferiority, intact competence/binding, Ae9/9 and Ce6/9 core with identical panelwise pattern to dual, and retained compensation. Small direct-experience losses remain; no interface simplification or independent confirmation."
boundary = "Three matched A/C instances, exposed dual references and panels; local memory removed during training, no human confirmation or promotion."

